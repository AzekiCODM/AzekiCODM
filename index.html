
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160b0d">
<title>AZEKI | CODM Armory</title>

<style>
:root {
  --red: #ff426d;
  --pink: #ff9aaa;
  --bg: #160b0d;
  --text: #fff4f5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at 20% 35%, #ff9b28, transparent 35%),
    radial-gradient(ellipse at 75% 50%, #c3311b, transparent 40%),
    linear-gradient(135deg, #160b0d, #64251b, #13090e);
  background-attachment: fixed;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 5%;
  background: #241014bd;
  backdrop-filter: blur(15px);
  border-bottom: 3px solid var(--red);
}

.brand {
  font-size: 27px;
  font-weight: 900;
  font-style: italic;
  color: white;
  text-decoration: none;
}

.brand span { color: var(--pink); }

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.pill, .profile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 17px;
  border: 1px solid var(--pink);
  border-radius: 12px;
  background: #a90027;
  color: white;
  font-weight: bold;
  text-decoration: none;
}

.profile {
  width: 46px;
  padding: 0;
  background: #174d83;
  font-size: 25px;
}

.hero {
  padding: 65px 15px 55px;
  text-align: center;
}

.eyebrow {
  color: #ffd0dc;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 4px;
}

.hero h1 {
  margin: 12px 0;
  font-size: clamp(48px, 12vw, 76px);
  font-style: italic;
  letter-spacing: 6px;
  text-shadow: 0 4px 25px #ff315a99;
}

.hero p {
  color: #ffe1e5;
  font-size: clamp(13px, 3.5vw, 19px);
}

.wrap {
  width: min(700px, 94%);
  margin: 0 auto 45px;
}

.panel {
  padding: 18px;
  margin-bottom: 25px;
  border: 2px solid var(--red);
  border-radius: 22px;
  background: linear-gradient(
    145deg,
    #ff603c55,
    #34131dcc
  );
  box-shadow: 0 0 25px #ff315a44;
  backdrop-filter: blur(12px);
}

.section-title {
  padding: 12px 5px;
  border: 2px solid var(--red);
  border-radius: 50px;
  text-align: center;
  font-size: 19px;
  font-style: italic;
  text-transform: uppercase;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

button { cursor: pointer; }

.category-btn {
  min-height: 85px;
  padding: 12px 5px;
  border: 1px solid var(--pink);
  border-radius: 15px;
  background: #571b2bc9;
  color: white;
  font-weight: bold;
  font-size: 14px;
}

.category-btn span {
  display: block;
  margin-bottom: 5px;
  font-size: 23px;
}

.category-btn:hover {
  background: #a32a47;
  box-shadow: 0 0 15px #ff426d88;
}

.note {
  color: #ffe1e5;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
}

footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 25px 10px;
  border-top: 3px solid var(--red);
  background: #68251b;
  text-align: center;
}

footer a {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: white;
  color: #180c10;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
}

dialog {
  width: min(650px, 94vw);
  max-height: 82vh;
  overflow-y: auto;
  padding: 14px;
  border: 2px solid var(--red);
  border-radius: 22px;
  color: white;
  background: linear-gradient(145deg, #a83b27f5, #26101cf7);
  box-shadow: 0 0 35px #ff315a77;
}

dialog::backdrop {
  background: #050205bb;
  backdrop-filter: blur(5px);
}

.modal-top {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.search {
  width: 100%;
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--pink);
  border-radius: 12px;
  background: #28121c;
  color: white;
  font-size: 16px;
}

.close {
  width: 46px;
  height: 46px;
  border: 1px solid var(--pink);
  border-radius: 10px;
  background: #a33a55;
  color: white;
  font-size: 27px;
}

.modal-title {
  margin: 10px 0 18px;
  padding: 12px 5px;
  border: 2px solid var(--red);
  border-radius: 50px;
  text-align: center;
  font-weight: bold;
  font-style: italic;
}

.weapon-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px 10px;
}

.weapon-card {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: white;
}

.weapon-image {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1.25;
  overflow: hidden;
  border: 3px solid var(--pink);
  border-radius: 22px;
  background: radial-gradient(ellipse, #777, #242027 75%);
  font-size: 37px;
}

.weapon-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.weapon-card strong {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  font-style: italic;
  overflow-wrap: anywhere;
}

.weapon-card:hover .weapon-image {
  border-color: white;
  box-shadow: 0 0 15px var(--red);
}

label {
  display: block;
  color: #ffe0e5;
  font-size: 13px;
}

select, input {
  width: 100%;
  margin-top: 7px;
  padding: 12px;
  border: 1px solid var(--pink);
  border-radius: 10px;
  background: #27121b;
  color: white;
  font-size: 15px;
}

.loadout-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.action-row button {
  flex: 1;
  min-height: 45px;
}

#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

@media (max-width: 380px) {
  header { padding: 12px; }
  .pill { padding: 0 10px; }
  .panel { padding: 12px; }
  .weapon-grid { gap: 12px 7px; }
  .weapon-image { border-radius: 15px; }
}
</style>
</head>

<body>

<header>
  <a class="brand" href="#">CHI<span>Z</span></a>
  <div class="header-right">
    <a class="pill" href="#armory">META</a>
    <a class="profile" href="#socials" aria-label="Profile">♙</a>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">CALL OF DUTY: MOBILE</div>
  <h1>AZEKI</h1>
  <p>MY GAME. MY LOADOUT. MY PLAYSTYLE.</p>
</section>

<main class="wrap" id="armory">
  <section class="panel">
    <h2 class="section-title">Choose Weapon Class</h2>
    <div class="categories" id="categories"></div>
    <p class="note">
      Choose a class, search for a weapon, and build your loadout.
    </p>
  </section>

  <section class="panel" id="loadout" hidden>
    <h2 class="section-title" id="loadoutTitle">Weapon Loadout</h2>
    <p class="note" id="weaponDescription"></p>
    <div class="loadout-grid" id="attachments"></div>
    <div class="action-row">
      <button class="category-btn" id="save">SAVE BUILD</button>
      <button class="category-btn" id="copy">COPY BUILD</button>
    </div>
    <p class="note" id="result"></p>
  </section>
</main>

<footer id="socials">
  <strong>DONATIONS<br>YOUR SUPPORT</strong>
  <strong>CALL OF DUTY<br>MOBILE ✦</strong>
  <a href="https://facebook.com/" aria-label="Facebook">f</a>
  <a href="https://discord.com/" aria-label="Discord">◉</a>
  <a href="https://instagram.com/" aria-label="Instagram">◎</a>
</footer>

<dialog id="weaponDialog">
  <div class="modal-top">
    <input class="search" id="weaponSearch"
      placeholder="⌕ Search weapons..." aria-label="Search weapons">
    <button class="close" id="closeDialog" aria-label="Close">×</button>
  </div>
  <div class="modal-title" id="modalTitle">ASSAULT RIFLE</div>
  <div class="weapon-grid" id="weaponGrid"></div>
</dialog>

<script>
const weapons = [
  ["AK-117","Assault Rifle"],
  ["AK-47","Assault Rifle"],
  ["AS VAL","Assault Rifle"],
  ["ASM10","Assault Rifle"],
  ["BK57","Assault Rifle"],
  ["CR-56 AMAX","Assault Rifle"],
  ["DR-H","Assault Rifle"],
  ["FR-556","Assault Rifle"],
  ["HBRa3","Assault Rifle"],
  ["HVK-30","Assault Rifle"],
  ["ICR-1","Assault Rifle"],
  ["Kilo 141","Assault Rifle"],
  ["KN-44","Assault Rifle"],
  ["LK24","Assault Rifle"],
  ["M13","Assault Rifle"],
  ["M4","Assault Rifle"],
  ["CBR4","Submachine Gun"],
  ["Fennec","Submachine Gun"],
  ["QQ9","Submachine Gun"],
  ["RUS-79U","Submachine Gun"],
  ["Switchblade X9","Submachine Gun"],
  ["PP19 Bizon","Submachine Gun"],
  ["Holger 26","Light Machine Gun"],
  ["RPD","Light Machine Gun"],
  ["KRM-262","Shotgun"],
  ["BY15","Shotgun"],
  ["DL Q33","Sniper Rifle"],
  ["Locus","Sniper Rifle"],
  ["Koshka","Sniper Rifle"],
  ["HDR","Sniper Rifle"],
  ["SKS","Marksman Rifle"],
  ["Renetti","Pistol"],
  ["Katana","Melee"]
];

const classes = [
  ["Assault Rifle","🎯"],
  ["Submachine Gun","⚡"],
  ["Light Machine Gun","💥"],
  ["Shotgun","✦"],
  ["Sniper Rifle","◎"],
  ["Marksman Rifle","⌁"],
  ["Pistol","◈"],
  ["Melee","⚔"]
];

const attachmentOptions = {
  "Muzzle": ["Suppressor","Compensator","Flash Guard"],
  "Barrel": ["Short Barrel","Extended Barrel","Marksman Barrel"],
  "Optic": ["Red Dot","Holographic","Tactical Scope"],
  "Stock": ["No Stock","Tactical Stock","Steady Stock"],
  "Laser": ["No Laser","Tactical Laser"],
  "Underbarrel": ["No Underbarrel","Strike Foregrip","Ranger Foregrip"],
  "Ammunition": ["Extended Mag","Fast Reload","Large Caliber"],
  "Rear Grip": ["Granulated Grip Tape","Stippled Grip Tape","Rubberized Grip Tape"]
};

const dialog = document.getElementById("weaponDialog");
const grid = document.getElementById("weaponGrid");
const search = document.getElementById("weaponSearch");
const categories = document.getElementById("categories");

let activeClass = "Assault Rifle";
let currentWeapon = null;
let currentSelects = [];

classes.forEach(([name, emoji]) => {
  const button = document.createElement("button");
  button.className = "category-btn";
  button.innerHTML = `<span>${emoji}</span>${name}`;
  button.addEventListener("click", () => openClass(name));
  categories.appendChild(button);
});

function openClass(name) {
  activeClass = name;
  document.getElementById("modalTitle").textContent = name;
  search.value = "";
  renderWeapons();
  dialog.showModal();
}

function renderWeapons() {
  grid.replaceChildren();

  const query = search.value.trim().toLowerCase();
  const matches = weapons.filter(([name, type]) =>
    type === activeClass &&
    name.toLowerCase().includes(query)
  );

  if (!matches.length) {
    grid.textContent = "No matching weapons found.";
    return;
  }

  matches.forEach(([name, type]) => {
    const button = document.createElement("button");
    button.className = "weapon-card";

    const art = document.createElement("div");
    art.className = "weapon-image";
    art.textContent = "⚔";

    const title = document.createElement("strong");
    title.textContent = name;

    button.append(art, title);
    button.addEventListener("click", () => {
      dialog.close();
      buildLoadout(name, type);
    });

    grid.appendChild(button);
  });
}

search.addEventListener("input", renderWeapons);
document.getElementById("closeDialog")
  .addEventListener("click", () => dialog.close());

function buildLoadout(name, type) {
  currentWeapon = { name, type };
  currentSelects = [];

  const section = document.getElementById("loadout");
  section.hidden = false;

  document.getElementById("loadoutTitle").textContent =
    name + " · LOADOUT";

  document.getElementById("weaponDescription").textContent =
    "Build your " + name + " setup. Choose your attachments below.";

  const container = document.getElementById("attachments");
  container.replaceChildren();

  Object.entries(attachmentOptions).forEach(([label, options]) => {
    const field = document.createElement("label");
    field.textContent = label;

    const select = document.createElement("select");
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select " + label.toLowerCase();
    select.appendChild(placeholder);

    options.forEach(option => {
      const item = document.createElement("option");
      item.value = option;
      item.textContent = option;
      select.appendChild(item);
    });

    select.addEventListener("change", updateSummary);
    field.appendChild(select);
    container.appendChild(field);

    currentSelects.push({ label, select });
  });

  updateSummary();
  section.scrollIntoView({ behavior: "smooth" });
}

function getSummary() {
  if (!currentWeapon) return "";

  return "AZEKI CODM LOADOUT\n" +
    "Weapon: " + currentWeapon.name + "\n" +
    "Class: " + currentWeapon.type + "\n\n" +
    currentSelects.map(item =>
      item.label + ": " + (item.select.value || "Not selected")
    ).join("\n");
}

function updateSummary() {
  document.getElementById("result").textContent = getSummary();
}

document.getElementById("save").addEventListener("click", () => {
  if (!currentWeapon) return;

  try {
    localStorage.setItem(
      "azeki-loadout-" + currentWeapon.name,
      getSummary()
    );
    document.getElementById("result").textContent =
      "BUILD SAVED ON THIS DEVICE!\n\n" + getSummary();
  } catch (error) {
    document.getElementById("result").textContent =
      "Saving is unavailable in this browser.\n\n" + getSummary();
  }
});

document.getElementById("copy").addEventListener("click", async () => {
  const text = getSummary();

  try {
    await navigator.clipboard.writeText(text);
    document.getElementById("result").textContent =
      "BUILD COPIED!\n\n" + text;
  } catch (error) {
    document.getElementById("result").textContent =
      "Select and copy this build manually:\n\n" + text;
  }
});
</script>
</body>
</html>
